# Fonts and images change rarely, so browsers may keep them for 30 days.
# Pages, the stylesheet and the script are checked on every visit.
map $uri $subarchy_cache {
    ~^/(fonts|assets)/  "public, max-age=2592000";
    default             "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    # The hash is the inline theme script in the head of every page. Change it with that script.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-t2l5ZI3xtU6dnlCiEjI9IQvmvsB0/d/CKTB7AG5AJmg='; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $subarchy_cache always;

    location = /README.md { return 404; }
    location / { try_files $uri $uri/ =404; }
}
