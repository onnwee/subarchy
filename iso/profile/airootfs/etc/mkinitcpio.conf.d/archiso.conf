# No archiso_pxe_* hooks: the image boots from a disc or USB stick only, and
# they add every network driver (13 MB of modules plus firmware, curl and NFS
# tools). subarchy_kms is the kms hook without nouveau and radeon (see its
# header).
HOOKS=(base udev microcode modconf subarchy_kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
