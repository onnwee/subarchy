# Subarchy DNS (ADR 0020): Quad9 over strict DNS-over-TLS serves every
# connection that has no DNS servers of its own, which is what
# `subcult dns set untrusted` leaves; lookups fail rather than fall back to
# plaintext. There is deliberately no global `Domains=~.`: a trusted
# connection carries `~.` on its own link so its servers answer instead,
# and a global `~.` would tie with it and send lookups to both.
# Installed to /usr/lib/systemd/resolved.conf.d/50-subarchy.conf; override in
# /etc/systemd/resolved.conf.d/.

[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::9#dns.quad9.net 2620:fe::fe#dns.quad9.net
DNSOverTLS=yes
DNSSEC=allow-downgrade
# .local names come from Avahi (mDNS); resolved's own mDNS and LLMNR stay off.
MulticastDNS=no
LLMNR=no
