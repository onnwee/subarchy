name: verify

# Pull requests are verified by .github/workflows/mirror-ci.yml on the GitHub
# organization copy (reported here as "GitHub CI / Mirror CI gate"); this
# workflow keeps verifying main after merge.
on:
  push:
    branches: [main]

# Bound worker pools to the job quota rather than the host CPU count.
env:
  GOMAXPROCS: "2"
  GOFLAGS: "-p=2"
  LP_NUM_THREADS: "2"
  UV_THREADPOOL_SIZE: "2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: make verify
        run: make verify
      - name: Pinned Pult package and app targets
        run: tools/test/pult-package-test.sh

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; this was the `latest` tag on 2026-11-20. To move it,
      # resolve the tag's current digest and change both jobs together.
      image: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      # Reap orphaned package-hook processes and leave room for build/render
      # threads. The runner default of 512 prevented even checkout from forking.
      options: --init --pids-limit=1024
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel go git nodejs pacman-contrib fakeroot hypridle librsvg imagemagick xorg-xcursorgen hyprcursor python lua python-pyte python-pillow ffmpeg ttf-dejavu qt6-multimedia power-profiles-daemon python-gobject adw-gtk-theme breeze zsh neovim hyprland ttf-jetbrains-mono-nerd ttf-liberation
      - name: Check process budget
        run: |
          cat /sys/fs/cgroup/pids.current /sys/fs/cgroup/pids.max
          ps -eLo comm= | sort | uniq -c | sort -nr | head -10
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and check the package as a normal user
        run: |
          useradd -m builder
          git config --global --add safe.directory "$PWD"
          chown -R builder: "$PWD"
          su builder -c "git config --global --add safe.directory '$PWD' && tools/ci/check-package-names.sh && make package"
      - name: Checks the Ubuntu verify job skips
        # Hyprland, Neovim, zsh, lua and the role fonts exist only here; each
        # of these tests skips without its tool, so a skip fails this step.
        # shell-rc-test drops zsh silently, so it must report both shells.
        run: |
          su builder -c 'export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 "$XDG_RUNTIME_DIR"; set -e
            for t in hypr-motion-test hypr-theme-test nvim-theme-test fontconfig-test shell-rc-test; do
              out=$(tools/test/$t.sh); echo "$out"; [[ $out != *skipped* ]]
              [[ $t != shell-rc-test || $out == *"(2 shells)"* ]]
            done
            out=$(make -s hypr-check); echo "$out"; [[ $out == *ok* ]]'

  shell:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
      # Reap orphaned package-hook processes and leave room for build/render
      # threads. The runner default of 512 prevented even checkout from forking.
      options: --init --pids-limit=1024
    steps:
      - name: Install Quickshell, Qt and the headless test tools
        run: |
          pacman -Syu --noconfirm --needed git make nodejs python python-gobject ffmpeg quickshell qt6-multimedia qt6-declarative sway grim imagemagick libnotify ttf-dejavu ttf-iosevkaterm-nerd ttf-jetbrains-mono-nerd libqalculate fd unicode-emoji wtype librsvg
          # Arch gives sway cap_sys_nice as a file capability, which a container
          # may not grant; without it the binary cannot start at all.
          setcap -r /usr/bin/sway
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Model tests, lint and widget index
        run: |
          git config --global --add safe.directory "$PWD"
          # Use the installed desktop's generic font roles in native previews.
          ln -s "$PWD/default/fontconfig/44-subarchy-roles.conf" /etc/fonts/conf.d/44-subarchy-roles.conf
          make shell-test shell-lint shell-index-check shell-native-test
      - name: Keep native greeter and panel previews
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: shell-previews
          path: build/*-preview/
          retention-days: 3
          if-no-files-found: warn
      - name: Shell in a headless sway
        run: |
          useradd -m runner
          chown -R runner: "$PWD"
          su runner -c "git config --global --add safe.directory '$PWD' && tools/test/shell-headless.sh shell"
      - name: Keep headless shell and lock diagnostics
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: shell-headless-logs
          path: build/shell-headless-logs/
          retention-days: 3
          if-no-files-found: warn
