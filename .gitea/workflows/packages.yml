name: packages

# A push to main builds and publishes. A version tag (v0.0.0) builds the
# release from the tag and publishes nothing: the publish job and
# publish-packages.py accept only main. On main, the iso-net job then
# builds and installs the network-install ISO from what was just published.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  GOMAXPROCS: "4"
  LP_NUM_THREADS: "2"

jobs:
  build:
    runs-on: subarchy-kvm
    timeout-minutes: 180
    steps:
      - name: Check disk reserve
        run: test "$(df -B1 --output=avail / | tail -1)" -ge 60000000000
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git nodejs python go pacman-contrib fakeroot hypridle librsvg imagemagick xorg-xcursorgen hyprcursor python-pyte python-pillow ffmpeg ttf-dejavu ttf-jetbrains-mono-nerd qt6-multimedia
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the core, keyring and pinned packages
        run: |
          git config --global --add safe.directory "$PWD"
          tools/ci/build-packages.sh
      - name: Read back the core package's version
        run: |
          core=$(find build/packages -name 'subarchy-[0-9]*.pkg.tar.zst')
          mkdir /tmp/core
          bsdtar -xf "$core" -C /tmp/core .PKGINFO etc/os-release usr/bin/subcult
          grep -E '^(VERSION|VERSION_ID|BUILD_ID)=' /tmp/core/etc/os-release
          tools/ci/check-core-version.sh /tmp/core
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: packages
          path: build/packages/
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: subarchy-kvm
    timeout-minutes: 30
    steps:
      - name: Install publishing and verification tools
        run: pacman -Syu --noconfirm --needed git nodejs python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          name: packages
          path: build/packages/
      - name: Publish to the signed stable and edge registries
        env:
          SUBARCHY_PACKAGE_TOKEN: ${{ secrets.SUBARCHY_PACKAGE_TOKEN }}
        run: python3 tools/ci/publish-packages.py
      - name: Verify signed databases and packages in this fresh container
        run: |
          pacman -U --noconfirm build/packages/subarchy-keyring-*.pkg.tar.zst
          pacman-key --init
          pacman-key --populate archlinux subarchy
          for channel in stable edge; do
            cp /etc/pacman.conf "/tmp/pacman-$channel.conf"
            printf '\n[subarchy]\nSigLevel = Required\nServer = https://git.subcult.tv/api/packages/subculture-collective/arch/%s/$arch\n' "$channel" >>"/tmp/pacman-$channel.conf"
            mapfile -t packages < build/packages/package-names.txt
            pacman --config "/tmp/pacman-$channel.conf" -Syddw --noconfirm "${packages[@]}"
          done
          # Arch's container image ships an /etc/os-release no package owns;
          # an install made by the installer has none before subarchy lands.
          pacman --config /tmp/pacman-stable.conf -S --noconfirm --overwrite /etc/os-release subarchy
          subcult --version

  # The network-install ISO for this commit, after its packages are in
  # stable: build-iso.sh downloads every pin at its exact source version, so
  # an ISO built before the publish fails on a new pin (#264). Running it
  # here, in the same run and concurrency group, also stops ISO jobs from
  # taking the single slot between build and publish (2026-11-20). Keep these
  # steps the same as iso.yml's `net` job, which runs on tags and by hand;
  # tools/test/test_ci_workflows.py checks that they match.
  iso-net:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: subarchy-kvm
    timeout-minutes: 120
    steps:
      - name: Check disk reserve
        run: test "$(df -B1 --output=avail / | tail -1)" -ge 60000000000
      - name: Install checkout tools
        run: pacman -Syu --noconfirm --needed git nodejs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the network-install ISO and boot it
        run: |
          git config --global --add safe.directory "$PWD"
          tools/ci/build-iso.sh net
      - name: Install from the ISO online and check the installed system
        run: tools/ci/install-test.sh net
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: iso-logs-net
          path: |
            build/makepkg.log
            build/iso-boot.log
            build/iso/*.sha256
            build/vm/*-serial.log
            build/vm/*.png
          retention-days: 7
          if-no-files-found: warn
      # Only when a run is started by hand: uploading the full image held the
      # runner for 45 minutes in which no other job could start.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: subarchy-iso-net
          path: |
            build/iso/*.iso
            build/iso/*.sha256
          retention-days: 2
          if-no-files-found: error
